// ─── ÍCONES SVG ────────────────────────────────────────────────────
const Ic = {
  img: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
  edit: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  trash: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
  plus: () => <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  close: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  up: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="18 15 12 9 6 15"/></svg>,
  down: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>,
  gear: () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,

// ─── PRODUCT CARD ──────────────────────────────────────────────────
function ProductCard({p, adminMode, onEdit, onDelete, gold, colors}) {
  const [hov, setHov] = useState(false);
  const hasImg = p.image && p.image.trim();
  return (
    <div style={{position:"relative",background:colors.card,aspectRatio:"3/4",overflow:"hidden",cursor:"pointer"}}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
      {hasImg
        ? <img src={p.image} alt={p.name} loading="lazy"
            style={{width:"100%",height:"100%",objectFit:"cover",display:"block",transform:hov&&!adminMode?"scale(1.05)":"scale(1)",transition:"transform 0.6s ease"}}/>
        : <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"rgba(255,255,255,0.1)",background:"#141414",gap:8}}>
            <Ic.img/>{adminMode&&<span style={{fontSize:"0.48rem",letterSpacing:"0.12em",textTransform:"uppercase"}}>Adicionar foto</span>}
          </div>
      }
      {p.esgotado && (
        <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{border:"1px solid rgba(255,255,255,0.25)",padding:"5px 14px",fontSize:"0.52rem",letterSpacing:"0.25em",textTransform:"uppercase",color:"rgba(255,255,255,0.5)"}}>Esgotado</div>
        </div>
      )}
      {!p.esgotado && <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,0.88) 0%,transparent 55%)"}}/>}
      <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"18px 12px 12px"}}>
        <span style={{display:"block",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.05rem",letterSpacing:"0.04em",color:p.esgotado?"rgba(255,255,255,0.3)":colors.text,lineHeight:1}}>{p.name}</span>
        {p.detail&&<span style={{display:"block",fontSize:"0.47rem",letterSpacing:"0.2em",textTransform:"uppercase",color:p.esgotado?"rgba(255,255,255,0.2)":gold,marginTop:3}}>{p.detail}</span>}
        {p.price&&!p.esgotado&&<span style={{display:"block",fontSize:"0.62rem",color:"rgba(255,255,255,0.55)",marginTop:4}}>{p.price}</span>}
      </div>
      {p.destaque&&!p.esgotado&&<div style={{position:"absolute",top:10,left:10,background:gold,color:"#000",fontSize:"0.44rem",letterSpacing:"0.18em",textTransform:"uppercase",padding:"3px 8px",fontWeight:600}}>Destaque</div>}
      {adminMode&&(
        <div style={{position:"absolute",top:8,right:8,display:"flex",gap:3}}>
          <button onClick={()=>onEdit(p)} style={{background:"rgba(0,0,0,0.8)",border:`1px solid ${gold}`,color:gold,width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic.edit/></button>
          <button onClick={()=>onDelete(p.id)} style={{background:"rgba(0,0,0,0.8)",border:"1px solid rgba(255,60,60,0.4)",color:"rgba(255,80,80,0.8)",width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic.trash/></button>
        </div>
      )}
    </div>
  );
}

// ─── MODAL PRODUTO ─────────────────────────────────────────────────
function ProductModal({product, categories, onSave, onClose, gold, colors}) {
  const [f, setF] = useState(product || {id:Date.now(),name:"",category:categories[0]?.id||"colares",price:"",detail:"",image:"",esgotado:false,destaque:false,order:99});
  const field = (k,label,type="text",opts=null) => (
    <div style={{marginBottom:13}}>
      <label style={{display:"block",fontSize:"0.52rem",letterSpacing:"0.2em",textTransform:"uppercase",color:gold,marginBottom:4}}>{label}</label>
      {opts
        ? <select value={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.value}))} style={{width:"100%",background:"#1a1a1a",border:"1px solid rgba(255,255,255,0.08)",color:colors.text,padding:"8px 10px",fontSize:"0.75rem"}}>
            {opts.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
          </select>
        : type==="checkbox"
          ? <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
              <input type="checkbox" checked={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.checked}))} style={{width:16,height:16,accentColor:gold}}/>
              <span style={{fontSize:"0.68rem",color:colors.text}}>{label==="Esgotado"?"Marcar como esgotado":"Marcar como destaque"}</span>
            </label>
          : <input type={type} value={f[k]} onChange={e=>setF(p=>({...p,[k]:e.target.value}))} placeholder={k==="image"?"Cole o link da imagem aqui":""}
              style={{width:"100%",background:"#1a1a1a",border:"1px solid rgba(255,255,255,0.08)",color:colors.text,padding:"8px 10px",fontSize:"0.75rem"}}/>
      }
    </div>
  );
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
      <div style={{background:"#111",border:`1px solid rgba(200,164,90,0.2)`,width:"100%",maxWidth:440,maxHeight:"90vh",overflowY:"auto",padding:26}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
          <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",color:gold,letterSpacing:"0.06em"}}>{product?"EDITAR PRODUTO":"NOVO PRODUTO"}</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:colors.text,cursor:"pointer"}}><Ic.close/></button>
        </div>
        {field("name","Nome do produto")}
        {field("category","Categoria","text",categories)}
        {field("detail","Detalhe (ex: Dourado, Prata)")}
        {field("price","Preço (opcional)")}
        {field("image","URL da foto")}
        {f.image&&<div style={{marginBottom:13,height:110,background:"#1a1a1a",overflow:"hidden"}}><img src={f.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/></div>}
        {field("esgotado","Esgotado","checkbox")}
        {field("destaque","Destaque","checkbox")}
        <div style={{display:"flex",gap:8,marginTop:22}}>
          <button onClick={onClose} style={{flex:1,padding:11,background:"none",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:"0.62rem",letterSpacing:"0.15em",textTransform:"uppercase"}}>Cancelar</button>
          <button onClick={()=>onSave(f)} style={{flex:2,padding:11,background:gold,border:"none",color:"#000",cursor:"pointer",fontSize:"0.62rem",letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:600}}>Salvar</button>
        </div>
      </div>
    </div>
  );
}

// ─── APP ───────────────────────────────────────────────────────────
function App() {
  const [config, setConfig] = useState(()=>ls.get("pc-config",INIT_CONFIG));
  const [cats, setCats] = useState(()=>ls.get("pc-cats",INIT_CATS));
  const [prods, setProds] = useState(()=>ls.get("pc-prods",INIT_PRODS));
  const [admin, setAdmin] = useState(false);
  const [pass, setPass] = useState("");
  const [showLogin, setShowLogin] = useState(false);
  const [view, setView] = useState("home");
  const [activeTab, setActiveTab] = useState("colares");
  const [adminTab, setAdminTab] = useState("produtos");
  const [editProd, setEditProd] = useState(null);
  const [showModal, setShowModal] = useState(false);
  const [saved, setSaved] = useState("");

  const save = (nc,nca,np) => {
    if(nc){setConfig(nc);ls.set("pc-config",nc);}
    if(nca){setCats(nca);ls.set("pc-cats",nca);}
    if(np){setProds(np);ls.set("pc-prods",np);}
    setSaved("✓ Salvo");setTimeout(()=>setSaved(""),1800);
  };

  const uCfg = (k,v) => {
    const nc = k.includes(".") ? (()=>{const[a,b]=k.split(".");return{...config,[a]:{...config[a],[b]:v}};})() : {...config,[k]:v};
    save(nc,null,null);
  };

  const saveProd = (prod) => {
    const exists = prods.find(p=>p.id===prod.id);
    const np = exists ? prods.map(p=>p.id===prod.id?prod:p) : [...prods,prod];
    save(null,null,np);
    setShowModal(false); setEditProd(null);
  };

  const delProd = (id) => {
    if(!confirm("Remover produto?")) return;
    save(null,null,prods.filter(p=>p.id!==id));
  };

  const moveProd = (id,dir) => {
    const cp = prods.filter(p=>p.category===activeTab).sort((a,b)=>a.order-b.order);
    const i = cp.findIndex(p=>p.id===id);
    if(dir===-1&&i===0) return;
    if(dir===1&&i===cp.length-1) return;
    const nc=[...cp];
    [nc[i].order,nc[i+dir].order]=[nc[i+dir].order,nc[i].order];
    save(null,null,prods.map(p=>{const u=nc.find(c=>c.id===p.id);return u||p;}));
  };

  const login = () => {
    if(pass==="pc2026"||pass===""){setAdmin(true);setShowLogin(false);setPass("");}
    else alert("Senha incorreta. Use: pc2026");
  };

  const {colors} = config;
  const gold = colors.gold;
  const df = "'Bebas Neue',sans-serif";
  const bf = "'Barlow Condensed',sans-serif";
  const catProds = (id) => prods.filter(p=>p.category===id).sort((a,b)=>a.order-b.order);
  const destaques = prods.filter(p=>p.destaque&&!p.esgotado).slice(0,6);

  return (
    <div style={{background:colors.bg,color:colors.text,fontFamily:bf,fontWeight:300,minHeight:"100vh",maxWidth:480,margin:"0 auto",position:"relative"}}>

      {/* NAV */}
      <nav style={{position:"fixed",top:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,zIndex:500,height:52,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 20px",background:"rgba(8,8,8,0.92)",backdropFilter:"blur(20px)",borderBottom:`1px solid rgba(200,164,90,0.12)`}}>
        <button onClick={()=>{setView("home");window.scrollTo(0,0);}} style={{background:"none",border:"none",cursor:"pointer",fontFamily:df,fontSize:"1.4rem",color:gold,letterSpacing:"0.12em"}}>PC</button>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <button onClick={()=>{setView("home");window.scrollTo(0,0);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:"0.5rem",letterSpacing:"0.22em",textTransform:"uppercase",color:view==="home"?gold:"rgba(240,237,232,0.4)",padding:"6px 8px",fontFamily:bf}}>Início</button>
          <button onClick={()=>{setView("catalog");setActiveTab("colares");window.scrollTo(0,0);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:"0.5rem",letterSpacing:"0.22em",textTransform:"uppercase",color:view==="catalog"?gold:"rgba(240,237,232,0.4)",padding:"6px 8px",fontFamily:bf}}>Catálogo</button>
          <button onClick={()=>admin?setAdmin(false):setShowLogin(true)} style={{background:admin?gold:"none",border:`1px solid ${admin?gold:"rgba(200,164,90,0.3)"}`,color:admin?"#000":gold,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",marginLeft:2}}><Ic.gear/></button>
        </div>
      </nav>

      {/* LOGIN */}
      {showLogin&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
          <div style={{background:"#111",border:`1px solid rgba(200,164,90,0.2)`,padding:30,width:"100%",maxWidth:300}}>
            <div style={{fontFamily:df,fontSize:"1.6rem",color:gold,letterSpacing:"0.1em",marginBottom:18}}>ADMIN</div>
            <div style={{fontSize:"0.52rem",color:"rgba(255,255,255,0.35)",letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:6,fontFamily:bf}}>Senha de acesso</div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&login()} placeholder="pc2026"
              style={{width:"100%",background:"#1a1a1a",border:"1px solid rgba(255,255,255,0.08)",color:colors.text,padding:"10px 12px",fontFamily:bf,marginBottom:14,fontSize:"0.8rem"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowLogin(false);setPass("");}} style={{flex:1,padding:10,background:"none",border:"1px solid rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.35)",cursor:"pointer",fontFamily:bf,fontSize:"0.6rem",letterSpacing:"0.15em",textTransform:"uppercase"}}>Cancelar</button>
              <button onClick={login} style={{flex:2,padding:10,background:gold,border:"none",color:"#000",cursor:"pointer",fontFamily:bf,fontSize:"0.6rem",letterSpacing:"0.15em",textTransform:"uppercase",fontWeight:600}}>Entrar</button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL PRODUTO */}
      {showModal&&<ProductModal product={editProd} categories={cats} onSave={saveProd} onClose={()=>{setShowModal(false);setEditProd(null);}} gold={gold} colors={colors}/>}

      {/* ADMIN PANEL */}
      {admin&&(
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,zIndex:400,background:"#0e0e0e",borderTop:`2px solid ${gold}`,maxHeight:"44vh",overflowY:"auto"}}>
          <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            {["produtos","categorias","aparência"].map(t=>(
              <button key={t} onClick={()=>setAdminTab(t)} style={{flex:1,padding:"10px 4px",background:"none",border:"none",borderBottom:adminTab===t?`2px solid ${gold}`:"2px solid transparent",color:adminTab===t?gold:"rgba(255,255,255,0.3)",cursor:"pointer",fontSize:"0.52rem",letterSpacing:"0.18em",textTransform:"uppercase",fontFamily:bf}}>{t}</button>
            ))}
            {saved&&<div style={{padding:"10px 10px",fontSize:"0.52rem",color:"#4caf50",fontFamily:bf,whiteSpace:"nowrap"}}>{saved}</div>}
          </div>

          {adminTab==="produtos"&&(
            <div style={{padding:14}}>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,overflowX:"auto"}}>
                <div style={{display:"flex",gap:4,flex:1,overflowX:"auto"}}>
                  {cats.map(c=>(
                    <button key={c.id} onClick={()=>setActiveTab(c.id)} style={{background:activeTab===c.id?gold:"rgba(255,255,255,0.05)",border:"none",color:activeTab===c.id?"#000":"rgba(255,255,255,0.45)",padding:"4px 10px",cursor:"pointer",fontSize:"0.48rem",letterSpacing:"0.14em",textTransform:"uppercase",fontFamily:bf,whiteSpace:"nowrap",flexShrink:0}}>{c.name}</button>
                  ))}
                </div>
                <button onClick={()=>{setEditProd(null);setShowModal(true);}} style={{background:gold,border:"none",color:"#000",width:27,height:27,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}><Ic.plus/></button>
              </div>
              {catProds(activeTab).map((p,i,arr)=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                  <div style={{width:42,height:42,background:"#1a1a1a",flexShrink:0,overflow:"hidden"}}>
                    {p.image&&<img src={p.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/>}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:"0.72rem",color:p.esgotado?"rgba(255,255,255,0.28)":colors.text,fontFamily:bf,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {p.name}{p.esgotado&&<span style={{color:"rgba(255,80,80,0.65)",fontSize:"0.52rem"}}> · esgotado</span>}{p.destaque&&<span style={{color:gold,fontSize:"0.52rem"}}> · destaque</span>}
                    </div>
                    <div style={{fontSize:"0.52rem",color:"rgba(255,255,255,0.28)",fontFamily:bf}}>{p.detail}{p.price?` · ${p.price}`:""}</div>
                  </div>
                  <div style={{display:"flex",gap:3,flexShrink:0}}>
                    <button onClick={()=>moveProd(p.id,-1)} disabled={i===0} style={{background:"rgba(255,255,255,0.04)",border:"none",color:i===0?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.45)",width:23,height:23,cursor:i===0?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic.up/></button>
                    <button onClick={()=>moveProd(p.id,1)} disabled={i===arr.length-1} style={{background:"rgba(255,255,255,0.04)",border:"none",color:i===arr.length-1?"rgba(255,255,255,0.12)":"rgba(255,255,255,0.45)",width:23,height:23,cursor:i===arr.length-1?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic.down/></button>
                    <button onClick={()=>{setEditProd(p);setShowModal(true);}} style={{background:`rgba(200,164,90,0.1)`,border:`1px solid rgba(200,164,90,0.3)`,color:gold,width:23,height:23,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic.edit/></button>
                    <button onClick={()=>delProd(p.id)} style={{background:"rgba(255,60,60,0.07)",border:"1px solid rgba(255,60,60,0.2)",color:"rgba(255,80,80,0.7)",width:23,height:23,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic.trash/></button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {adminTab==="categorias"&&(
            <div style={{padding:14}}>
              {cats.map(cat=>(
                <div key={cat.id} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:"0.68rem",color:colors.text,marginBottom:4,fontFamily:bf}}>{cat.name}</div>
                    <input value={cat.coverImage} placeholder="URL da foto de capa" onChange={e=>{const nc=cats.map(c=>c.id===cat.id?{...c,coverImage:e.target.value}:c);save(null,nc,null);}}
                      style={{width:"100%",background:"#1a1a1a",border:"1px solid rgba(255,255,255,0.07)",color:colors.text,padding:"6px 8px",fontFamily:bf,fontSize:"0.65rem"}}/>
                  </div>
                  {cat.coverImage&&<div style={{width:42,height:42,overflow:"hidden",flexShrink:0}}><img src={cat.coverImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>e.target.style.display="none"}/></div>}
                </div>
              ))}
            </div>
          )}

          {adminTab==="aparência"&&(
            <div style={{padding:14}}>
              {[["brand","Nome da marca"],["tagline","Tagline"],["instagram","Instagram"],["heroImage","Foto do hero (URL)"]].map(([k,l])=>(
                <div key={k} style={{marginBottom:11}}>
                  <div style={{fontSize:"0.5rem",color:gold,letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:4,fontFamily:bf}}>{l}</div>
                  <input value={config[k]||""} onChange={e=>uCfg(k,e.target.value)} style={{width:"100%",background:"#1a1a1a",border:"1px solid rgba(255,255,255,0.07)",color:colors.text,padding:"7px 10px",fontFamily:bf,fontSize:"0.72rem"}}/>
                </div>
              ))}
              <div style={{fontSize:"0.5rem",color:gold,letterSpacing:"0.18em",textTransform:"uppercase",marginBottom:8,fontFamily:bf}}>Cores</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {[["bg","Fundo"],["gold","Dourado"],["text","Texto"],["card","Card"]].map(([k,l])=>(
                  <div key={k} style={{display:"flex",alignItems:"center",gap:5}}>
                    <input type="color" value={colors[k]} onChange={e=>uCfg(`colors.${k}`,e.target.value)} style={{width:26,height:26,border:"none",background:"none",cursor:"pointer",padding:0}}/>
                    <span style={{fontSize:"0.52rem",color:"rgba(255,255,255,0.35)",fontFamily:bf}}>{l}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── HOME ── */}
      {view==="home"&&(
        <div style={{paddingTop:52,paddingBottom:admin?"44vh":0}}>
          {/* Hero */}
          <div style={{position:"relative",height:"100svh",overflow:"hidden",display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
            {config.heroImage
              ? <img src={config.heroImage} alt="hero" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",objectPosition:"center 20%"}}/>
              : <div style={{position:"absolute",inset:0,background:"linear-gradient(135deg,#1a1010 0%,#080808 100%)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {admin&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.12)"}}>
                    <Ic.img/><div style={{fontSize:"0.52rem",letterSpacing:"0.15em",textTransform:"uppercase",marginTop:10,fontFamily:bf}}>Adicione a foto do hero na aba Aparência</div>
                  </div>}
                </div>
            }
            <div style={{position:"absolute",inset:0,background:"linear-gradient(to bottom,rgba(8,8,8,0) 0%,rgba(8,8,8,0.45) 50%,rgba(8,8,8,0.97) 100%)"}}/>
            <div style={{position:"relative",zIndex:2,padding:"0 28px 56px",animation:"fadeup 1s ease forwards"}}>
              <div style={{fontSize:"0.54rem",letterSpacing:"0.48em",textTransform:"uppercase",color:gold,marginBottom:14,fontFamily:bf}}>Coleção 2026 · Revendedoras</div>
              <h1 style={{fontFamily:df,fontSize:"5.6rem",lineHeight:0.86,marginBottom:18,letterSpacing:"0.02em"}}>
                {config.brand.split(" ")[0]}<br/><span style={{color:gold}}>{config.brand.split(" ").slice(1).join(" ")}</span>
              </h1>
              <p style={{fontSize:"0.58rem",letterSpacing:"0.24em",textTransform:"uppercase",color:"rgba(240,237,232,0.38)",fontFamily:bf}}>{config.tagline}</p>
            </div>
          </div>

          {/* Marquee */}
          <div style={{overflow:"hidden",borderTop:`1px solid rgba(200,164,90,0.16)`,borderBottom:`1px solid rgba(200,164,90,0.16)`,padding:"13px 0",background:"#0b0b0b"}}>
            <div style={{display:"flex",width:"max-content",animation:"marquee 22s linear infinite"}}>
              {[...cats,...cats].map((c,i)=>(
                <span key={i} style={{fontFamily:df,fontSize:"1rem",color:i%2===0?"rgba(200,164,90,0.55)":"rgba(200,164,90,0.18)",whiteSpace:"nowrap",padding:"0 18px",letterSpacing:"0.08em"}}>
                  {i%2===0?c.name.toUpperCase():"·"}
                </span>
              ))}
            </div>
          </div>

          {/* Grid categorias */}
          <div style={{padding:"38px 20px 18px"}}>
            <div style={{fontSize:"0.5rem",letterSpacing:"0.38em",textTransform:"uppercase",color:gold,marginBottom:6,fontFamily:bf}}>Explorar</div>
            <h2 style={{fontFamily:df,fontSize:"2.4rem",color:colors.text,marginBottom:18,lineHeight:0.9}}>CATEGORIAS</h2>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3}}>
              {cats.map(cat=>(
                <div key={cat.id} onClick={()=>{setView("catalog");setActiveTab(cat.id);window.scrollTo(0,0);}}
                  style={{position:"relative",aspectRatio:"1/1",overflow:"hidden",background:"#111",cursor:"pointer"}}>
                  {cat.coverImage
                    ? <img src={cat.coverImage} alt={cat.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                    : <div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"#141414",color:"rgba(255,255,255,0.1)"}}><Ic.img/></div>
                  }
                  <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,0.85) 0%,transparent 55%)"}}/>
                  <div style={{position:"absolute",bottom:12,left:14}}>
                    <div style={{fontFamily:df,fontSize:"1.55rem",color:colors.text,lineHeight:1}}>{cat.name}</div>
                    <div style={{fontSize:"0.46rem",color:gold,letterSpacing:"0.2em",textTransform:"uppercase",fontFamily:bf}}>{catProds(cat.id).length} peças</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Destaques */}
          {destaques.length>0&&(
            <div style={{padding:"30px 0 36px"}}>
              <div style={{padding:"0 20px",marginBottom:18}}>
                <div style={{fontSize:"0.5rem",letterSpacing:"0.38em",textTransform:"uppercase",color:gold,marginBottom:6,fontFamily:bf}}>Seleção especial</div>
                <h2 style={{fontFamily:df,fontSize:"2.4rem",color:colors.text,lineHeight:0.9}}>DESTAQUES</h2>
              </div>
              <div style={{display:"flex",gap:3,overflowX:"auto",padding:"0 20px",scrollbarWidth:"none"}}>
                {destaques.map(p=>(
                  <div key={p.id} style={{width:158,flexShrink:0}}>
                    <ProductCard p={p} adminMode={false} onEdit={()=>{}} onDelete={()=>{}} gold={gold} colors={colors}/>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* CTA */}
          <div style={{padding:"28px 20px 40px",textAlign:"center",borderTop:`1px solid rgba(200,164,90,0.08)`}}>
            <div style={{fontSize:"0.5rem",letterSpacing:"0.38em",textTransform:"uppercase",color:gold,marginBottom:10,fontFamily:bf}}>Conheça todas as peças</div>
            <button onClick={()=>{setView("catalog");setActiveTab("colares");window.scrollTo(0,0);}} style={{background:"none",border:`1px solid ${gold}`,color:gold,padding:"13px 30px",fontFamily:bf,fontSize:"0.58rem",letterSpacing:"0.28em",textTransform:"uppercase",cursor:"pointer"}}>Ver catálogo completo →</button>
          </div>

          {/* Footer */}
          <div style={{padding:"28px 20px 44px",textAlign:"center",borderTop:`1px solid rgba(200,164,90,0.08)`}}>
            <div style={{fontFamily:df,fontSize:"3rem",color:gold,letterSpacing:"0.1em",marginBottom:6}}>PC</div>
            <div style={{fontSize:"0.5rem",letterSpacing:"0.28em",textTransform:"uppercase",color:"rgba(255,255,255,0.22)",fontFamily:bf}}>{config.instagram} · {config.brand} · 2026</div>
          </div>
        </div>
      )}

      {/* ── CATÁLOGO ── */}
      {view==="catalog"&&(
        <div style={{paddingTop:52,paddingBottom:admin?"44vh":0}}>
          <div style={{position:"sticky",top:52,zIndex:300,background:"rgba(8,8,8,0.95)",backdropFilter:"blur(12px)",borderBottom:"1px solid rgba(255,255,255,0.05)"}}>
            <div style={{display:"flex",overflowX:"auto",scrollbarWidth:"none"}}>
              {cats.map(cat=>(
                <button key={cat.id} onClick={()=>setActiveTab(cat.id)} style={{background:"none",border:"none",borderBottom:activeTab===cat.id?`2px solid ${gold}`:"2px solid transparent",color:activeTab===cat.id?gold:"rgba(240,237,232,0.32)",padding:"13px 15px",cursor:"pointer",fontSize:"0.52rem",letterSpacing:"0.18em",textTransform:"uppercase",fontFamily:bf,whiteSpace:"nowrap",flexShrink:0}}>
                  {cat.name}
                </button>
              ))}
            </div>
          </div>

          <div style={{padding:"26px 22px 18px"}}>
            <div style={{fontSize:"0.48rem",letterSpacing:"0.38em",textTransform:"uppercase",color:gold,marginBottom:6,fontFamily:bf}}>
              Categoria · {cats.find(c=>c.id===activeTab)?.number}
            </div>
            <h2 style={{fontFamily:df,fontSize:"3.4rem",color:colors.text,lineHeight:0.9,textTransform:"uppercase"}}>{cats.find(c=>c.id===activeTab)?.name}</h2>
            <div style={{fontSize:"0.5rem",color:"rgba(255,255,255,0.28)",marginTop:7,fontFamily:bf,letterSpacing:"0.1em"}}>{catProds(activeTab).length} peças</div>
          </div>

          {catProds(activeTab).length>0
            ? <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3,padding:"0 3px 3px"}}>
                {catProds(activeTab).map(p=>(
                  <ProductCard key={p.id} p={p} adminMode={admin} onEdit={prod=>{setEditProd(prod);setShowModal(true);}} onDelete={delProd} gold={gold} colors={colors}/>
                ))}
              </div>
            : <div style={{padding:"44px 24px",textAlign:"center",color:"rgba(255,255,255,0.18)"}}>
                <Ic.img/><div style={{marginTop:12,fontSize:"0.58rem",letterSpacing:"0.14em",textTransform:"uppercase",fontFamily:bf}}>{admin?"Adicione produtos no painel abaixo":"Em breve"}</div>
              </div>
          }
          <div style={{height:44}}/>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
